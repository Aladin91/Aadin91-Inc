name: AladinAI Build and Tests

on:
  push:
    paths:
      - 'aladin-ai/**'
      - '.github/workflows/aladin-ai-tests.yml'
  pull_request:
    paths:
      - 'aladin-ai/**'
      - '.github/workflows/aladin-ai-tests.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aladin-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build full browser bundle
        run: npm run build
      - name: Run core, advanced and extra tests
        run: npm test
      - name: Verify generated browser bundle exists
        run: test -s dist/aladin-ai.js
