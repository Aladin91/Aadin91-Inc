name: Deploy AladinAI to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: aladin-ai-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and test AladinAI
        working-directory: aladin-ai
        run: npm run check
      - name: Assemble Pages site
        run: |
          mkdir -p _site/examples _site/cloud
          cp aladin-ai/site/index.html _site/index.html
          cp aladin-ai/dist/aladin-ai.js _site/aladin-ai.js
          sha256sum aladin-ai/dist/aladin-ai.js | sed 's#aladin-ai/dist/aladin-ai.js#aladin-ai.js#' > _site/aladin-ai.js.sha256
          cp aladin-ai/examples/*.html _site/examples/
          cp aladin-ai/cloud/*.json _site/cloud/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
